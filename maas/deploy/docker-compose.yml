# MaaS 网关：Higress gateway（静态 envoy.yaml + maas-cache / maas-scheduler 两个 WASM 插件）
# + 3 个 mock-vllm 副本 + Redis（maas-cache 的 L2）。
#
#   cd maas/deploy && ./up.sh                  # 构建插件并启动
#   docker compose run --rm loadgen ...        # 压测工具（profile: tools）
#
# 对外端口：10000 网关 / 10001 纯轮询基线 / 8001-8003 直连各副本 / 9901 Envoy admin / 6379 Redis
name: maas

x-mock-vllm: &mock-vllm
  build:
    context: ../tools/mock-vllm
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  image: maas/mock-vllm:dev
  environment:
    MOCK_SERVED_MODEL_NAME: ${MODEL_NAME:-mock-qwen}
    MOCK_TIME_SCALE: ${MOCK_TIME_SCALE:-1.0}
    MOCK_MAX_NUM_SEQS: ${MOCK_MAX_NUM_SEQS:-128}
    MOCK_NUM_GPU_BLOCKS: ${MOCK_NUM_GPU_BLOCKS:-8192}
    MOCK_MAX_NUM_BATCHED_TOKENS: ${MOCK_MAX_NUM_BATCHED_TOKENS:-2048}
  restart: unless-stopped

services:
  gateway:
    image: ${GATEWAY_IMAGE:-higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/gateway:v2.2.4}
    entrypoint: ["/usr/local/bin/envoy"]
    command:
      - -c
      - /etc/envoy/envoy.yaml
      - --concurrency
      - "${GATEWAY_CONCURRENCY:-2}"
      - --component-log-level
      - wasm:${WASM_LOG_LEVEL:-info}
    ports:
      - "10000:10000"
      - "10001:10001"
      - "9901:9901"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ../../plugins/wasm-go/extensions/maas-cache/main.wasm:/etc/envoy/plugins/maas-cache.wasm:ro
      - ../../plugins/wasm-go/extensions/maas-scheduler/main.wasm:/etc/envoy/plugins/maas-scheduler.wasm:ro
    depends_on: [mock-vllm-0, mock-vllm-1, mock-vllm-2, redis]
    restart: unless-stopped

  mock-vllm-0:
    <<: *mock-vllm
    hostname: mock-vllm-0
    ports: ["8001:8000"]

  mock-vllm-1:
    <<: *mock-vllm
    hostname: mock-vllm-1
    ports: ["8002:8000"]

  mock-vllm-2:
    <<: *mock-vllm
    hostname: mock-vllm-2
    ports: ["8003:8000"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lfu"]
    ports: ["6379:6379"]
    restart: unless-stopped

  loadgen:
    build:
      context: ../tools/loadgen
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: maas/loadgen:dev
    profiles: ["tools"]
    volumes:
      - ../results:/results
    depends_on: [gateway]
